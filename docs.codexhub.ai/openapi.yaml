openapi: 3.1.0
info:
  title: Expense Sharing API
  description: |
    API for an expense sharing application that allows users to track, split, and manage shared expenses.
    Features include user management, expense tracking with multiple split methods, and balance sheet generation.
  version: 1.0.0
  contact:
    name: API Support
    email: support@expensesharing.com
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.expensesharing.com
    description: Production server

components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        errors:
          type: array
          items:
            type: object
          description: Detailed validation errors
      required:
        - message
    
    AuthToken:
      type: object
      properties:
        message:
          type: string
          description: Status message
        token:
          type: string
          description: Bearer token for authentication
      required:
        - message
        - token
    
    UserSignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User's email address
        name:
          type: string
          description: User's full name
        mobileNumber:
          type: string
          description: User's mobile number
        password:
          type: string
          format: password
          minLength: 8
          description: User's password (min 8 characters)
      required:
        - email
        - name
        - mobileNumber
        - password
    
    UserSigninRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          description: User's password
      required:
        - email
        - password
    
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User's unique identifier
        email:
          type: string
          format: email
          description: User's email address
        name:
          type: string
          description: User's full name
        mobileNumber:
          type: string
          description: User's mobile number
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Account last update timestamp
      required:
        - id
        - email
        - name
        - mobileNumber
        - createdAt
        - updatedAt
    
    ExpenseParticipant:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: Participant's user ID
        amount:
          type: number
          nullable: true
          description: Amount allocated to this participant (for EXACT split)
        percentage:
          type: number
          nullable: true
          description: Percentage allocated to this participant (for PERCENTAGE split)
      required:
        - userId
    
    ExpenseCreateRequest:
      type: object
      properties:
        amount:
          type: number
          description: Total expense amount
        description:
          type: string
          description: Description of the expense
        creatorId:
          type: string
          format: uuid
          description: ID of the user creating the expense
        splitMethod:
          type: string
          enum: [EQUAL, EXACT, PERCENTAGE]
          description: Method used to split the expense
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseParticipant'
          description: List of participants in the expense
      required:
        - amount
        - description
        - creatorId
        - splitMethod
        - participants
    
    ExpenseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Expense's unique identifier
        amount:
          type: number
          description: Total expense amount
        description:
          type: string
          description: Description of the expense
        date:
          type: string
          format: date-time
          description: Date when the expense was created
        creatorId:
          type: string
          format: uuid
          description: ID of the user who created the expense
        splitMethod:
          type: string
          enum: [EQUAL, EXACT, PERCENTAGE]
          description: Method used to split the expense
        participants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              userId:
                type: string
                format: uuid
              amount:
                type: number
                nullable: true
              percentage:
                type: number
                nullable: true
              expenseId:
                type: string
                format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - amount
        - description
        - date
        - creatorId
        - splitMethod
        - participants
        - createdAt
        - updatedAt
    
    PaymentNode:
      type: object
      properties:
        from:
          type: string
          format: uuid
          description: User ID who owes money
        to:
          type: string
          format: uuid
          description: User ID who is owed money
        amount:
          type: number
          description: Amount to be paid
      required:
        - from
        - to
        - amount
    
    BalanceSheetResponse:
      type: object
      properties:
        individualExpenses:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              description:
                type: string
              amount:
                type: number
              date:
                type: string
                format: date-time
              participants:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: string
                      format: uuid
                    amount:
                      type: number
        totalOwed:
          type: number
          description: Total amount owed by the user
        totalOwedToOthers:
          type: number
          description: Total amount owed to the user
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/PaymentNode'
          description: Optimized payment flow
      required:
        - individualExpenses
        - totalOwed
        - totalOwedToOthers
        - transactions
  
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained during signin or signup

paths:
  /api/users/signup:
    post:
      summary: Create a new user account
      operationId: signupUser
      tags:
        - User Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          description: Invalid input or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/users/signin:
    post:
      summary: Sign in to an existing account
      operationId: signinUser
      tags:
        - User Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSigninRequest'
      responses:
        '200':
          description: Successfully signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          description: Invalid credentials or user does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/users/{id}:
    get:
      summary: Get user details by ID
      operationId: getUserById
      tags:
        - User Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/expenses:
    post:
      summary: Create a new expense
      operationId: createExpense
      tags:
        - Expense Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      summary: Get all expenses
      operationId: getAllExpenses
      tags:
        - Expense Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of all expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/expenses/user/{userId}:
    get:
      summary: Get expenses for a specific user
      operationId: getUserExpenses
      tags:
        - Expense Management
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: List of user's expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/expenses/balance-sheet:
    get:
      summary: Generate and download balance sheet
      operationId: downloadBalanceSheet
      tags:
        - Expense Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balance sheet CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/expenses/{id}:
    get:
      summary: Get expense details by ID
      operationId: getExpenseById
      tags:
        - Expense Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Expense ID
      responses:
        '200':
          description: Expense details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Update an existing expense
      operationId: updateExpense
      tags:
        - Expense Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Expense ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
      responses:
        '200':
          description: Expense updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Delete an expense
      operationId: deleteExpense
      tags:
        - Expense Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Expense ID
      responses:
        '200':
          description: Expense deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to delete this expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'